name: Security updates

# Updates npm dependencies affected by security advisories to fixed versions
# released at least 14 days ago (see scripts/update_vulnerable_deps) and opens
# or updates a PR from the deps/security-updates branch. The branch is
# rewritten on every run, so don't push changes to it.
#
# PRs opened with the default GITHUB_TOKEN don't trigger GitHub Actions
# workflows. To run them, store a token of a GitHub App or a fine-grained
# personal access token (contents and pull requests: read and write) in the
# SECURITY_UPDATES_TOKEN secret.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only show the planned updates; don't push or open a PR.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: security-updates
  cancel-in-progress: false

jobs:
  update:
    name: Update vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Push the deps/security-updates branch.
      pull-requests: write # Open, update or close its PR.
    env:
      BRANCH: deps/security-updates
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Update vulnerable dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_BRANCH: ${{ env.BRANCH }}
        run: |
          ./scripts/update_vulnerable_deps --summary "${RUNNER_TEMP}/summary.md"
          cat "${RUNNER_TEMP}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          git diff --stat

      - name: Open, update or close the PR
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_UPDATES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          title="Update vulnerable npm dependencies"
          existing="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"

          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "No updates."
            if [[ -n "${existing}" ]]; then
              gh pr close "${existing}" --delete-branch \
                --comment "No dependency updates are needed any more; closing."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git commit -q -m "${title}" -- package.json pnpm-lock.yaml
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force origin "HEAD:refs/heads/${BRANCH}"

          if [[ -n "${existing}" ]]; then
            gh pr edit "${existing}" --title "${title}" --body-file "${RUNNER_TEMP}/summary.md"
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "${BRANCH}" \
              --title "${title}" --body-file "${RUNNER_TEMP}/summary.md"
          fi
