name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'WORKSPACE', 'MODULE.bazel', 'MODULE.bazel.lock', 'yarn.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Run lint and format checks
        run: ./scripts/lint

      - name: Run unit tests
        run: ./scripts/run_tests
