name: Test

on:
  pull_request:
  push:
    branches: [main, windows-support]
  workflow_dispatch:

jobs:
  test-linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3.0.0

      - name: Run unit tests
        run: ./scripts/run_tests

      - name: Build package tarballs
        run: bazel build //packages/@dataform/cli:package_tar //packages/@dataform/core:package_tar

      - name: Upload CLI tarball
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dataform-cli-tarball
          path: bazel-bin/packages/@dataform/cli/package.tar.gz

      - name: Upload Core tarball
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dataform-core-tarball
          path: bazel-bin/packages/@dataform/core/package.tar.gz

  test-windows:
    name: CLI smoke & unit tests (Windows)
    needs: test-linux
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Download CLI tarball
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: dataform-cli-tarball
          path: dist/cli

      - name: Download Core tarball
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: dataform-core-tarball
          path: dist/core

      - name: Install @dataform/cli globally from tarball
        run: npm install -g dist/cli/package.tar.gz

      - name: Run Windows smoke tests in PowerShell
        shell: powershell
        run: |
          node scripts/smoke_test_windows.js --shell powershell --core-tarball dist/core/package.tar.gz

      - name: Run Windows smoke tests in cmd.exe
        shell: cmd
        run: |
          node scripts\smoke_test_windows.js --shell cmd --core-tarball dist\core\package.tar.gz
