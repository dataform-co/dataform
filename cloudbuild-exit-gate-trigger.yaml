# Follow-up release build for `cloudbuild-publish.yaml`.
#
# Started by the last step of the publish build through a manual Cloud Build
# trigger (`exit-gate-npm-release-trigger`), run at the published commit. It waits
# until the publish build has finished, so that Cloud Build has uploaded the npm
# packages and attached their provenance, and only then uploads the Exit Gate
# release manifest and creates the GitHub release.
steps:
  # Check the GitHub token first, so a bad token fails the build before the npm
  # release is started.
  - name: "gcr.io/$PROJECT_ID/github"
    secretEnv: ["GITHUB_TOKEN"]
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      GITHUB_TOKEN="$(printf '%s' "${GITHUB_TOKEN}" | tr -d '\r\n')"
      export GITHUB_TOKEN
      gh auth status >/dev/null
  - name: "gcr.io/cloud-builders/gcloud"
    env:
      - "PARENT_BUILD_ID=$_PARENT_BUILD_ID"
      - "COMMIT_SHA=$COMMIT_SHA"
      - "LOCATION=$LOCATION"
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      [ -n "${PARENT_BUILD_ID}" ] || { echo "missing _PARENT_BUILD_ID" >&2; exit 1; }
      # Wait up to 30 minutes for the publish build to finish.
      for _ in $(seq 1 180); do
        status=$(gcloud builds describe "${PARENT_BUILD_ID}" --region="${LOCATION}" --format='value(status)')
        case "${status}" in
          SUCCESS) break ;;
          QUEUED|PENDING|WORKING) sleep 10 ;;
          *) echo "Publish build ${PARENT_BUILD_ID} ended with status ${status}; not releasing." >&2; exit 1 ;;
        esac
      done
      [ "${status}" = "SUCCESS" ] || { echo "Timed out waiting for publish build ${PARENT_BUILD_ID}." >&2; exit 1; }
      # Take the branch and commit from the publish build itself rather than
      # trusting the values passed to this build.
      publish_trigger_id=$(gcloud builds triggers describe push-to-main-publish-trigger --region="${LOCATION}" --format='value(id)')
      parent_trigger_id=$(gcloud builds describe "${PARENT_BUILD_ID}" --region="${LOCATION}" --format='value(buildTriggerId)')
      parent_commit=$(gcloud builds describe "${PARENT_BUILD_ID}" --region="${LOCATION}" --format='value(substitutions.COMMIT_SHA)')
      parent_branch=$(gcloud builds describe "${PARENT_BUILD_ID}" --region="${LOCATION}" --format='value(substitutions.BRANCH_NAME)')
      [ "${parent_trigger_id}" = "${publish_trigger_id}" ] || { echo "Build ${PARENT_BUILD_ID} was not started by the publish trigger." >&2; exit 1; }
      [ "${parent_commit}" = "${COMMIT_SHA}" ] || { echo "Publish build commit ${parent_commit} does not match ${COMMIT_SHA}." >&2; exit 1; }
      [ -n "${parent_branch}" ] || { echo "Publish build has no branch." >&2; exit 1; }
      ./scripts/write_exit_gate_manifest "${parent_branch}"
      gcloud storage cp publish_all.json gs://oss-exit-gate-prod-projects-bucket/dataform/npm/manifests/publish_all.json
  - name: "gcr.io/$PROJECT_ID/github"
    env:
      - "COMMIT_SHA=$COMMIT_SHA"
    # gh reads GITHUB_TOKEN from the environment; the token is never written to disk.
    secretEnv: ["GITHUB_TOKEN"]
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      version=$(grep 'DF_VERSION' version.bzl | awk '{ print $3 }' | tr -d '"')
      # Secret Manager payloads may end with a newline, which gh would send as part
      # of the Authorization header.
      GITHUB_TOKEN="$(printf '%s' "${GITHUB_TOKEN}" | tr -d '\r\n')"
      export GITHUB_TOKEN
      if gh release view "$version" >/dev/null 2>&1; then
        echo "Release $version already exists, skipping"
      else
        echo "Creating release notes for $version"
        prerelease_flag=""
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || prerelease_flag="--prerelease"
        gh release create "$version" --target "${COMMIT_SHA}" --generate-notes ${prerelease_flag}
      fi
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-token-access/versions/latest
      env: "GITHUB_TOKEN"
substitutions:
  _PARENT_BUILD_ID: ""
timeout: 2400s
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
