steps:
  - name: "gcr.io/cloud-builders/gcloud"
    script: |
      #!/usr/bin/env bash
      gcloud auth print-access-token > ~/gcp_token.txt
      REPO_TOKEN="$(cat ~/gcp_token.txt)" ./scripts/create_npmrc
  - name: "gcr.io/cloud-builders/gcloud"
    script: |
      #!/usr/bin/env bash
      ./scripts/run_negative_canary_test
options:
  machineType: E2_HIGHCPU_8
  automapSubstitutions: true
timeout: 3600s
