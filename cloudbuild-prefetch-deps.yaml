# Prefetches new npm dependencies (from open dependency PRs and from fixes for
# security advisories) through the registry configured in the trigger's
# _PREFETCH_REGISTRY substitution.
# If the optional _CI_REGISTRY substitution is set to the registry the test
# builds install from, the log also shows which versions are available there.
# If _CI_REGISTRY is set, the failed tests of dependency PRs are also re-run once
# all their new versions are available, with the Cloud Build push trigger named
# in _RERUN_TRIGGER (see scripts/rerun_dependency_pr_tests).
# Intended to run from a scheduled Cloud Build trigger. See
# scripts/prefetch_npm_deps. This build never fails: problems are only logged.
steps:
  - name: "gcr.io/cloud-builders/gcloud"
    env:
      - "PREFETCH_REGISTRY=${_PREFETCH_REGISTRY}"
      - "CI_REGISTRY=${_CI_REGISTRY}"
    script: |
      #!/usr/bin/env bash
      if ! REGISTRY_TOKEN="$(gcloud auth print-access-token)"; then
        echo "WARNING: could not get an access token; skipping prefetch" >&2
        exit 0
      fi
      REGISTRY_TOKEN="${REGISTRY_TOKEN}" ./scripts/prefetch_npm_deps ||
        echo "WARNING: prefetch failed" >&2
  - name: "gcr.io/cloud-builders/gcloud"
    env:
      - "RERUN_TRIGGER=${_RERUN_TRIGGER}"
      - "CI_REGISTRY=${_CI_REGISTRY}"
      - "PROJECT_ID=${PROJECT_ID}"
      - "REGION=${LOCATION}"
    script: |
      #!/usr/bin/env bash
      if [[ -z "${RERUN_TRIGGER}" || -z "${CI_REGISTRY}" ]]; then
        echo "_RERUN_TRIGGER or _CI_REGISTRY isn't set; not re-running dependency PR tests"
        exit 0
      fi
      if ! REGISTRY_TOKEN="$(gcloud auth print-access-token)"; then
        echo "WARNING: could not get an access token; not re-running tests" >&2
        exit 0
      fi
      REGISTRY_TOKEN="${REGISTRY_TOKEN}" ./scripts/rerun_dependency_pr_tests ||
        echo "WARNING: re-running dependency PR tests failed" >&2
substitutions:
  _CI_REGISTRY: "" # Optional; set in the trigger.
  _RERUN_TRIGGER: "test-dependency-branches-trigger" # Can be overridden in the trigger.
timeout: 600s
