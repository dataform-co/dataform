steps:
  - name: "gcr.io/cloud-builders/gcloud"
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      gcloud secrets versions access latest --secret=github-token-access --format='get(payload.data)' | tr '_-' '/+' | base64 -d > ~/token.txt
      REPO_TOKEN="$(gcloud auth print-access-token)" ./scripts/create_npmrc
      PACKAGES_TO_DELETE=$(gcloud artifacts packages list \
        --project=oss-exit-gate-prod \
        --location=us \
        --repository=dataform--npm \
        --format="value(name)")
      for pkg in $PACKAGES_TO_DELETE; do
        gcloud artifacts packages delete "$pkg" \
          --project=oss-exit-gate-prod \
          --location=us \
          --repository=dataform--npm \
          --quiet
      done
  - name: gcr.io/cloud-builders/bazel:7.3.2
    script: |
      #!/usr/bin/env bash
      ./scripts/publish
  - name: "gcr.io/cloud-builders/gcloud"
    script: |
      #!/usr/bin/env bash
      gcloud storage cp publish_all.json gs://oss-exit-gate-prod-projects-bucket/dataform/npm/manifests/publish_all.json
  - name: "gcr.io/$PROJECT_ID/github"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        version=$(cat version.bzl | grep DF_VERSION | awk '{ print $3 }' | sed "s/\"//g")
        echo "Creating release notes for $version"
        gh auth login --with-token < ~/token.txt
        gh release create $version --generate-notes
artifacts:
  npmPackages:
    - repository: 'https://us-central1-npm.pkg.dev/dataform-open-source/dataform-open-source'
      packagePath: './npm_packages/cli'
    - repository: 'https://us-central1-npm.pkg.dev/dataform-open-source/dataform-open-source'
      packagePath: './npm_packages/core'
options:
  machineType: E2_HIGHCPU_8
  requestedVerifyOption: VERIFIED
timeout: 3600s
