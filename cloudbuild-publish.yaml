steps:
  - name: "gcr.io/cloud-builders/gcloud"
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      REPO_TOKEN="$(gcloud auth print-access-token)" ./scripts/create_npmrc
      PACKAGES_TO_DELETE=$(gcloud artifacts packages list \
        --project=oss-exit-gate-prod \
        --location=us \
        --repository=dataform--npm \
        --format="value(name)")
      for pkg in $PACKAGES_TO_DELETE; do
        gcloud artifacts packages delete "$pkg" \
          --project=oss-exit-gate-prod \
          --location=us \
          --repository=dataform--npm \
          --quiet
      done
  - name: gcr.io/cloud-builders/bazel:7.3.2
    env:
      - "BRANCH_NAME=$BRANCH_NAME"
      - "BUILD_ID=$BUILD_ID"
    script: |
      #!/usr/bin/env bash
      ./scripts/publish
  # Start the release build. It waits for this build to finish (including the
  # artifact uploads below) before releasing anything.
  - name: "gcr.io/cloud-builders/gcloud"
    env:
      - "BUILD_ID=$BUILD_ID"
      - "BRANCH_NAME=$BRANCH_NAME"
      - "COMMIT_SHA=$COMMIT_SHA"
      - "LOCATION=$LOCATION"
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      gcloud builds triggers run exit-gate-npm-release-trigger \
        --region="${LOCATION}" \
        --sha="${COMMIT_SHA}" \
        --substitutions="_PARENT_BUILD_ID=${BUILD_ID},_BRANCH_NAME=${BRANCH_NAME}" \
        --format='value(metadata.build.id)'
artifacts:
  npmPackages:
    - repository: 'https://us-npm.pkg.dev/oss-exit-gate-prod/dataform--npm'
      packagePath: './npm_packages/cli'
    - repository: 'https://us-npm.pkg.dev/oss-exit-gate-prod/dataform--npm'
      packagePath: './npm_packages/core'
options:
  machineType: E2_HIGHCPU_8
  requestedVerifyOption: VERIFIED
timeout: 3600s
