steps:
  - name: "gcr.io/cloud-builders/gcloud"
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      REPO_TOKEN="$(gcloud auth print-access-token)" ./scripts/create_npmrc
  - name: gcr.io/cloud-builders/bazel:7.3.2
    env:
      - "BRANCH_NAME=$BRANCH_NAME"
      - "BUILD_ID=$BUILD_ID"
    script: |
      #!/usr/bin/env bash
      ./scripts/publish
  # Clear previous staging uploads and start the release build. It waits for
  # this build to finish (including the artifact uploads below) before copying
  # staged packages or releasing anything.
  - name: "gcr.io/cloud-builders/gcloud"
    env:
      - "BUILD_ID=$BUILD_ID"
      - "COMMIT_SHA=$COMMIT_SHA"
      - "LOCATION=$LOCATION"
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      packages_to_delete=$(gcloud artifacts packages list \
        --project=dataform-open-source \
        --location=us \
        --repository=dataform-npm-staging \
        --format="value(name)")
      for pkg in ${packages_to_delete}; do
        gcloud artifacts packages delete "${pkg}" \
          --project=dataform-open-source \
          --location=us \
          --repository=dataform-npm-staging \
          --quiet
      done
      gcloud builds triggers run exit-gate-npm-release-trigger \
        --region="${LOCATION}" \
        --sha="${COMMIT_SHA}" \
        --substitutions="_PARENT_BUILD_ID=${BUILD_ID}" \
        --format='value(metadata.build.id)'
artifacts:
  npmPackages:
    - repository: 'https://us-npm.pkg.dev/dataform-open-source/dataform-npm-staging'
      packagePath: './npm_packages/cli'
    - repository: 'https://us-npm.pkg.dev/dataform-open-source/dataform-npm-staging'
      packagePath: './npm_packages/core'
options:
  machineType: E2_HIGHCPU_8
  requestedVerifyOption: VERIFIED
timeout: 3600s
