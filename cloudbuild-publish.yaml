steps:
  - name: "gcr.io/cloud-builders/gcloud"
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      REPO_TOKEN="$(gcloud auth print-access-token)" ./scripts/create_npmrc
      PACKAGES_TO_DELETE=$(gcloud artifacts packages list \
        --project=oss-exit-gate-prod \
        --location=us \
        --repository=dataform--npm \
        --format="value(name)")
      for pkg in $PACKAGES_TO_DELETE; do
        gcloud artifacts packages delete "$pkg" \
          --project=oss-exit-gate-prod \
          --location=us \
          --repository=dataform--npm \
          --quiet
      done
  - name: gcr.io/cloud-builders/bazel:7.3.2
    env:
      - "BRANCH_NAME=$BRANCH_NAME"
      - "BUILD_ID=$BUILD_ID"
    script: |
      #!/usr/bin/env bash
      ./scripts/publish
artifacts:
  npmPackages:
    - repository: 'https://us-npm.pkg.dev/oss-exit-gate-prod/dataform--npm'
      packagePath: './npm_packages/cli'
    - repository: 'https://us-npm.pkg.dev/oss-exit-gate-prod/dataform--npm'
      packagePath: './npm_packages/core'
options:
  machineType: E2_HIGHCPU_8
  requestedVerifyOption: VERIFIED
timeout: 3600s
