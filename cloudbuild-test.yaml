steps:
  - name: "gcr.io/cloud-builders/gcloud"
    script: |
      #!/usr/bin/env bash
      gcloud auth print-access-token > ~/gcp_token.txt
      REPO_TOKEN="$(cat ~/gcp_token.txt)" NPM_TOKEN="test_only" ./scripts/create_npmrc
  - name: gcr.io/cloud-builders/bazel:7.3.2
    script: |
      #!/usr/bin/env bash
      ./scripts/run_tests_on_cloudbuild
substitutions:
  _CANARY_GCP_PROJECT: "dataform-open-source"
  _CANARY_LOCATION: "us-central1"
  _CANARY_REPO: "canary-repo"
options:
  machineType: E2_HIGHCPU_8
  automapSubstitutions: true
timeout: 3600s
