syntax = "proto3";

package dataform;

option go_package = "github.com/dataform-co/dataform/protos/dataform";

message BigQuery {
  string project_id = 1;
  // If credentials are unset, then the library will use the application default
  // credentials
  string credentials = 3;
  // Options are listed here: https://cloud.google.com/bigquery/docs/locations
  string location = 4;
  // Optional service account to impersonate, e.g. sa@my-project.iam.gserviceaccount.com.
  // The credentials above (or the application default credentials) are used as the
  // source credentials and need roles/iam.serviceAccountTokenCreator on this account.
  string impersonate_service_account = 5;
  // The universe domain to connect to (e.g. "s3nsapis.fr"). Leave unset to
  // use the default Google Default Universe (GDU). Set this when targeting a
  // Trusted Partner Cloud (TPC) or another non-default universe.
  string universe_domain = 6;

  reserved 2;
}
