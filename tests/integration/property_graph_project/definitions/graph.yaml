name: "LibraryGraph"

tags: ["integration"]

entities:
- name: "Author"
  ref: "authors"
  keys: "id"
  extensions:
  - key: "domain"
    value: "library"
  fields:
  - name: "id"
    expression: "id"
  - name: "name"
    expression: "name"
    extensions:
    - key: "pii"
      value: "true"

- name: "Book"
  ref: "books"
  keys: "id"
  fields:
  - name: "id"
    expression: "id"
  - name: "title"
    expression: "title"

relationships:
- name: "Wrote"
  ref: "wrote"
  keys: ["author_id", "book_id"]
  extensions:
  - key: "kind"
    value: "authorship"
  source:
    entity: "Author"
    join_keys: ["author_id"]
  destination:
    entity: "Book"
    join_keys: ["book_id"]
