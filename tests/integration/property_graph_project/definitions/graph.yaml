version: 0.2.0.dev0/google
tags: ["integration"]
semantic_model:
  - name: "LibraryGraph"
    entities:
      - name: "Author"
        source:
          ref: "authors"
        primary_key: "id"
        description: "Library author"
        ai_context:
          synonyms: ["writer"]
          examples: ["Alice"]
        fields:
          - name: "id"
            datatype: "INT64"
          - name: "name"
            datatype: "STRING"
          - name: "upper_name"
            datatype: "STRING"
            expression: "UPPER(Author.name)"
          - name: "address"
          - name: "country"
            expression: "Author.address.country"
          - name: "group"
            expression: "Author.name"
      - name: "Book"
        source:
          ref: "books"
        primary_key: "id"
        fields:
          - name: "id"
          - name: "title"
    relationships:
      - name: "Wrote"
        source:
          ref: "wrote"
        primary_key: ["author_id", "book_id"]
        from: "Author"
        to: "Book"
        from_columns: ["author_id"]
        to_columns: ["book_id"]
    metrics:
      - name: "book_count"
        entity: "Book"
        expression: "COUNT(Book.id)"
        description: "Total books"
