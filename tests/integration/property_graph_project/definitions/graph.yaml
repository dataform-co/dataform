name: "LibraryGraph"

tags: ["integration"]

nodes:
- name: "Author"
  ref: "authors"
  keys: "id"
  fields:
  - name: "id"
    expression: "id"
  - name: "name"
    expression: "name"

- name: "Book"
  ref: "books"
  keys: "id"
  fields:
  - name: "id"
    expression: "id"
  - name: "title"
    expression: "title"

edges:
- name: "Wrote"
  ref: "wrote"
  keys: ["author_id", "book_id"]
  source:
    node: "Author"
    join_keys: ["author_id"]
  destination:
    node: "Book"
    join_keys: ["book_id"]
