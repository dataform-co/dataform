version: 0.2.0.dev0/google
tags: ["integration"]
semantic_model:
  - name: "LibraryGraph"
    entities:
      - name: "Author"
        source:
          ref: "authors"
        primary_key: "id"
        description: "Library author"
        ai_context:
          synonyms: ["writer"]
          examples: ["Alice"]
        fields:
          - name: "id"
            datatype: "INT64"
          - name: "name"
            datatype: "STRING"
          - name: "upper_name"
            datatype: "STRING"
            expression: "UPPER(name)"
          - name: "address"
          - name: "country"
            expression: "address.country"
          - name: "group"
            expression: "name"
      - name: "Book"
        source:
          ref: "books"
        primary_key: "id"
        fields:
          - "id"
          - "title"
          - "pages"
      - name: "Authorship"
        source:
          ref: "wrote"
        primary_key: ["author_id", "book_id"]
    relationships:
      - name: "Wrote"
        from: "Authorship"
        to: "Author"
        from_columns: ["author_id"]
        to_columns: ["id"]
      - name: "WroteBook"
        from: "Authorship"
        to: "Book"
        from_columns: ["book_id"]
        to_columns: ["id"]
    metrics:
      - name: "book_count"
        entity: "Book"
        datatype: "INT64"
        expression: "COUNT(id)"
        description: "Total books"
      - name: "total_pages"
        entity: "Book"
        datatype: "INT64"
        expression: "SUM(pages)"
        description: "Total pages across books"
      - name: "avg_pages"
        entity: "Book"
        datatype: "FLOAT64"
        expression: "SAFE_DIVIDE(AGG(total_pages), NULLIF(AGG(book_count), 0))"
        description: "Average pages per book"
        ai_context:
          instructions: "Use AGG(Book_avg_pages) over GRAPH_EXPAND."
          examples: ["What is the average page count?"]
          custom:
            unit_type: "pages"
        custom_extensions:
          - vendor_name: "dbt"
            data: '{"meta":{"tier":"gold"}}'
